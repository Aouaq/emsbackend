# nginx site config for dev.aouaq.site
# Copy to /etc/nginx/sites-available/dev.aouaq.site and symlink to sites-enabled.
# After editing: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name dev.aouaq.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.aouaq.site;

    # TLS - managed by certbot (Let's Encrypt). certbot --nginx fills these in.
    # ssl_certificate     /etc/letsencrypt/live/dev.aouaq.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.aouaq.site/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -------------------------------------------------------------------------
    # SSE alarm stream — must NOT be buffered
    #
    # nginx buffers proxied responses by default. For a normal JSON endpoint that
    # is fine; for an SSE stream it means every byte (including heartbeat comments)
    # sits in the proxy buffer until the connection closes, so the client receives
    # nothing, its read timeout fires, it disconnects, and the reconnect loop
    # hammers /api/auth/refresh into the rate limiter.
    #
    # The backend also sets X-Accel-Buffering: no on these responses, which is the
    # per-response way to do the same thing — this location block is belt-and-braces
    # and raises proxy_read_timeout so it outlasts the emitter's 30-minute lifetime.
    # -------------------------------------------------------------------------
    location ~ ^/api/(me|admin)/alarms/stream$ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;         # HTTP/1.0 (the default) has no chunked encoding
        proxy_set_header Connection "";  # clear the HTTP/1.0 "close" header for keep-alive
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;          # emitter lifetime is 30 min; default 60s is too short
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # All other API traffic
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
