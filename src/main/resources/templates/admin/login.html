<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Admin Login')}"></head>
<body>
<main>
    <div style="max-width: 380px; margin: 4rem auto;">
        <div class="card">
            <h1 style="text-align:center;">ElectricWave Admin</h1>
            <div class="alert alert-err" th:if="${param.error}">
                Invalid admin email or password.
            </div>
            <div class="alert alert-ok" th:if="${param.logout}">
                You have been logged out.
            </div>
            <p class="muted" style="margin-top:0;">Log in with an account that has the ADMIN role.</p>
            <form th:action="@{/admin/login}" method="post">
                <div class="field">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" required autofocus autocomplete="username"/>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"/>
                </div>
                <button type="submit" class="btn" style="width:100%;">Log in</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
