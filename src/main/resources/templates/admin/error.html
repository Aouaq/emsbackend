<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments :: nav('')}"></nav>
<main>
    <h1 th:text="${title}">Something went wrong</h1>

    <div class="card">
        <div class="alert alert-err" th:text="${errorMessage}">Unexpected error</div>

        <p class="muted" th:if="${traceId}">
            Reference for the server log: <span th:text="${traceId}"></span>
        </p>

        <div class="actions">
            <a class="btn" th:href="@{/admin/dashboard}">Back to dashboard</a>
        </div>
    </div>
</main>
</body>
</html>
