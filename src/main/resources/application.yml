# =============================================================================
# ElectricWave access backend - base configuration (no secrets, no defaults
# that are unsafe outside development). Profile-specific values live in
# application-dev.yml and application-prod.yml.
# =============================================================================

spring:
  application:
    name: electricwave-access
  profiles:
    default: dev

  # ----------------------------------------------------------------------------
  # PostgreSQL (matches compose.yaml; override via env in real deployments)
  # ----------------------------------------------------------------------------
  # No defaults here on purpose: a deployment missing DB_* must fail to start rather
  # than quietly try the compose.yaml development credentials against localhost. The
  # development values live in application-dev.yml.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Audited operations hold two connections at once: the business transaction plus
      # the REQUIRES_NEW audit write nested inside it (see AuditService). Sizing this at
      # the number of concurrent requests would therefore deadlock at half that load.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 5000

  # ----------------------------------------------------------------------------
  # JPA
  # ----------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------------------------------------------
  # Flyway
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ----------------------------------------------------------------------------
  # Redis (verification codes, refresh tokens, rate limits)
  # ----------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty in development, where Redis is a sibling container on a private network
      # and nothing else can reach it. Required in any deployment that publishes a port
      # or shares a host: this instance holds every refresh token, so an unauthenticated
      # Redis is a way to mint sessions for the whole fleet, not merely a cache to warm.
      password: ${REDIS_PASSWORD:}

  # ----------------------------------------------------------------------------
  # Mail (SMTP) - start-up safe: app.mail.enabled=false skips sending entirely
  # ----------------------------------------------------------------------------
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        # Set so JavaMail never resolves this host's own name. It otherwise does so twice
        # per send, and each reverse lookup took ~17s on a developer machine with no PTR
        # record, making a single send 37s. Measured per phase: 37.0s -> 3.5s.
        #   mail.smtp.localhost - the name sent in EHLO.
        #   mail.from           - without it, InternetAddress.getLocalAddress() falls back
        #                         to InetAddress.getLocalHost().getHostName() to build the
        #                         Message-ID header. The From header is set explicitly by
        #                         MailService, so this only supplies that domain part.
        #                         It tracks app.mail.from (the Spring property, so a
        #                         config file counts, not only APP_MAIL_FROM) to keep the
        #                         Message-ID domain the same as the real sender's.
        # Neither value is validated by the relay; what matters is that both are fixed.
        from: ${app.mail.from}
        smtp:
          localhost: ${SPRING_MAIL_LOCALHOST:electricwave.local}
          auth: true
          starttls:
            enable: true
          # A ceiling, not a delay: a healthy relay is unaffected by a generous value.
          # Raised from 5s because that is tight for a transactional send over a slow or
          # congested link, where a timeout turns a slow email into a lost one.
          connectiontimeout: ${SPRING_MAIL_CONNECT_TIMEOUT:20000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT:20000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:20000}

  # Auto-starts the containers in compose.yaml during development
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Off by default. The probe opens an SMTP connection on every call to
    # /actuator/health, so wherever SMTP is blocked it waits out the whole 20s connect
    # timeout and then reports the entire service 503 - a mail outage reads as a dead
    # instance, which is how a restart loop begins. Measured on Render: 22.9s and 503,
    # with the framework itself logging "contributor (mail) took 20030ms to respond".
    #
    # Little is lost. It proved only that a TCP connection was possible, never that a
    # message would be accepted, while RegisterResponse.verificationCodeSent already
    # reports real delivery per request. Set APP_MAIL_HEALTH_ENABLED=true to restore it
    # where the relay is reachable and the signal is wanted.
    mail:
      enabled: ${APP_MAIL_HEALTH_ENABLED:false}

# =============================================================================
# Application specific settings
# =============================================================================
app:
  # AES-256-GCM master key, base64 encoded, exactly 32 bytes.
  crypto:
    master-key: ${APP_CRYPTO_MASTER_KEY:}

  # JWT: HS256. The secret must be at least 32 bytes and has no default.
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:electricwave}
    expiration: ${APP_JWT_EXPIRATION:15m}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:30d}

  # Redis-backed fixed-window rate limits for public authentication endpoints.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-ip-per-minute: ${APP_RATE_LIMIT_LOGIN_IP_PER_MINUTE:10}
    login-email-per-minute: ${APP_RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:5}
    register-ip-per-hour: ${APP_RATE_LIMIT_REGISTER_IP_PER_HOUR:5}
    verify-ip-per-10-minutes: ${APP_RATE_LIMIT_VERIFY_IP_PER_10_MINUTES:20}
    resend-email-per-10-minutes: ${APP_RATE_LIMIT_RESEND_EMAIL_PER_10_MINUTES:3}
    resend-ip-per-hour: ${APP_RATE_LIMIT_RESEND_IP_PER_HOUR:10}
    refresh-ip-per-minute: ${APP_RATE_LIMIT_REFRESH_IP_PER_MINUTE:30}
    google-ip-per-10-minutes: ${APP_RATE_LIMIT_GOOGLE_IP_PER_10_MINUTES:10}
    claim-per-user-per-minute: ${APP_RATE_LIMIT_CLAIM_PER_USER_PER_MINUTE:5}
    claim-per-ip-per-minute: ${APP_RATE_LIMIT_CLAIM_PER_IP_PER_MINUTE:20}
    forgot-per-email-per-hour: ${APP_RATE_LIMIT_FORGOT_PER_EMAIL_PER_HOUR:3}
    forgot-per-ip-per-hour: ${APP_RATE_LIMIT_FORGOT_PER_IP_PER_HOUR:10}
    reset-per-ip-per-10-minutes: ${APP_RATE_LIMIT_RESET_PER_IP_PER_10_MINUTES:10}
    change-password-per-user-per-10-minutes: ${APP_RATE_LIMIT_CHANGE_PASSWORD_PER_USER_PER_10_MINUTES:5}

  # Origins allowed to call /api/** from a browser (the Flutter web build). Comma-
  # separated patterns, e.g. https://app.example.com. Empty disables CORS entirely,
  # which is correct for a deployment that serves no browser client.
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

  # Only trust X-Forwarded-For when the direct peer is one of these proxies.
  trusted-proxies: ${APP_TRUSTED_PROXIES:}

  http:
    max-request-bytes: ${APP_HTTP_MAX_REQUEST_BYTES:1048576}


  # Native Google sign-in (ID token verified locally). Browser OAuth is not used.
  #
  # A comma-separated list of every Google OAuth client whose ID tokens are accepted.
  # Each platform signs in with its own client and the token's `aud` is that client, so
  # supporting Android, macOS and desktop means listing all three. Entries must belong
  # to this Google project: the audience is what proves a token was minted for us.
  # Only client IDs go here - no client secret is involved in verifying an ID token.
  oauth2:
    google:
      client-id: ${APP_OAUTH2_GOOGLE_CLIENT_ID:}

  # Bootstrap admin account (created on first boot if no ADMIN exists).
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_NAME:System Administrator}

  # Mail / verification
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@electricwave.local}

    # Which transport carries the message.
    #   smtp  - Spring's JavaMailSender over spring.mail.* above. The default, and what
    #           a developer machine uses.
    #   brevo - POST to Brevo's HTTP API. Required on platforms that block outbound
    #           SMTP: Render drops traffic to 25/465/587, so a JavaMail connect there
    #           hangs for the full 20s connect timeout and then fails, per send.
    # Only one transport bean exists at a time; see service/mail/MailTransport.kt.
    transport: ${APP_MAIL_TRANSPORT:smtp}

    # Used only when transport=brevo, which refuses to start without a key. This is the
    # API key, not the separate SMTP key Brevo issues for its relay.
    api-key: ${APP_MAIL_API_KEY:}
    api-base-url: ${APP_MAIL_API_BASE_URL:https://api.brevo.com/v3}

  # ----------------------------------------------------------------------------
  # Site monitoring
  # ----------------------------------------------------------------------------
  # Polls every registered access key's Emoncms feeds and records threshold
  # crossings, so alarms exist whether or not anyone has the app open.
  #
  # This is the one place the backend reads Emoncms. The gateway that used to
  # proxy reads for the app was removed on purpose and is not coming back; a
  # server cannot watch data it is not allowed to see, which is a different
  # argument from proxying requests a client could make itself.
  #
  # NOTE: a sweep only runs while the instance is awake. On a host that sleeps
  # when idle the symptom is an alarm list that stays empty, which looks exactly
  # like nothing being wrong. Keep something polling the health endpoint.
  monitor:
    enabled: ${APP_MONITOR_ENABLED:true}
    interval: ${APP_MONITOR_INTERVAL:PT30S}
    emoncms-base-url: ${APP_MONITOR_EMONCMS_BASE_URL:http://electricwave.ma/energymonitoring}

    # Fleet-wide fallbacks for a site with no row of its own. Deliberately
    # permissive: a default is what an unconfigured site is judged by, and a
    # strict one means every newly registered site alarms on day one and
    # teaches whoever sees it to ignore the alarms.
    #
    # 230 V was the original value, taken from an example script, and it was
    # wrong for this fleet in the worst way - measured live, sites run between
    # 215 V and 233 V, so the "default" sat in the middle of normal operation.
    # Tightening past this belongs in a per-site row, not here.
    default-max-power: ${APP_MONITOR_MAX_POWER:142000}
    default-min-voltage: ${APP_MONITOR_MIN_VOLTAGE:210}

    # Readings older than this are not judged at all. A site that stopped
    # reporting still returns its last value, and an alarm latched on a
    # months-old number could never clear.
    stale-after: ${APP_MONITOR_STALE_AFTER:PT15M}

    # How far past its limit a reading must come back before the alarm clears,
    # as a fraction of the limit. Without it a site sitting *at* its threshold
    # crosses in both directions every sweep: measured against the real fleet,
    # capteur3tc01kammah produced 25 alarm episodes in 64 minutes at 227-230 V
    # against a 230 V floor. 1% is comfortably past the observed jitter of ~2 V
    # and still clears a genuine recovery.
    clear-deadband: ${APP_MONITOR_CLEAR_DEADBAND:0.01}
    concurrency: ${APP_MONITOR_CONCURRENCY:4}

  # DEV ONLY: return the verification code in API responses when mail is off.
  auth:
    expose-verification-code: ${APP_AUTH_EXPOSE_VERIFICATION_CODE:false}

# =============================================================================
# OpenAPI / Swagger UI (ADMIN-only, see SecurityConfig)
# =============================================================================
springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.security: INFO
    ma.electricwave: INFO
