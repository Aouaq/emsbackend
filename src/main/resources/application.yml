# =============================================================================
# ElectricWave access backend - base configuration (no secrets, no defaults
# that are unsafe outside development). Profile-specific values live in
# application-dev.yml and application-prod.yml.
# =============================================================================

spring:
  application:
    name: electricwave-access
  profiles:
    default: dev

  # ----------------------------------------------------------------------------
  # PostgreSQL (matches compose.yaml; override via env in real deployments)
  # ----------------------------------------------------------------------------
  # No defaults here on purpose: a deployment missing DB_* must fail to start rather
  # than quietly try the compose.yaml development credentials against localhost. The
  # development values live in application-dev.yml.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Audited operations hold two connections at once: the business transaction plus
      # the REQUIRES_NEW audit write nested inside it (see AuditService). Sizing this at
      # the number of concurrent requests would therefore deadlock at half that load.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 5000

  # ----------------------------------------------------------------------------
  # JPA
  # ----------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------------------------------------------
  # Flyway
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ----------------------------------------------------------------------------
  # Redis (verification codes, refresh tokens, rate limits)
  # ----------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ----------------------------------------------------------------------------
  # Mail (SMTP) - start-up safe: app.mail.enabled=false skips sending entirely
  # ----------------------------------------------------------------------------
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        # Set so JavaMail never resolves this host's own name. It otherwise does so twice
        # per send, and each reverse lookup took ~17s on a developer machine with no PTR
        # record, making a single send 37s. Measured per phase: 37.0s -> 3.5s.
        #   mail.smtp.localhost - the name sent in EHLO.
        #   mail.from           - without it, InternetAddress.getLocalAddress() falls back
        #                         to InetAddress.getLocalHost().getHostName() to build the
        #                         Message-ID header. The From header is set explicitly by
        #                         MailService, so this only supplies that domain part.
        #                         It tracks app.mail.from (the Spring property, so a
        #                         config file counts, not only APP_MAIL_FROM) to keep the
        #                         Message-ID domain the same as the real sender's.
        # Neither value is validated by the relay; what matters is that both are fixed.
        from: ${app.mail.from}
        smtp:
          localhost: ${SPRING_MAIL_LOCALHOST:electricwave.local}
          auth: true
          starttls:
            enable: true
          # A ceiling, not a delay: a healthy relay is unaffected by a generous value.
          # Raised from 5s because that is tight for a transactional send over a slow or
          # congested link, where a timeout turns a slow email into a lost one.
          connectiontimeout: ${SPRING_MAIL_CONNECT_TIMEOUT:20000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT:20000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:20000}

  # Auto-starts the containers in compose.yaml during development
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# =============================================================================
# Application specific settings
# =============================================================================
app:
  # AES-256-GCM master key, base64 encoded, exactly 32 bytes.
  crypto:
    master-key: ${APP_CRYPTO_MASTER_KEY:}

  # JWT: HS256. The secret must be at least 32 bytes and has no default.
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:electricwave}
    expiration: ${APP_JWT_EXPIRATION:15m}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:30d}

  # Redis-backed fixed-window rate limits for public authentication endpoints.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-ip-per-minute: ${APP_RATE_LIMIT_LOGIN_IP_PER_MINUTE:10}
    login-email-per-minute: ${APP_RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:5}
    register-ip-per-hour: ${APP_RATE_LIMIT_REGISTER_IP_PER_HOUR:5}
    verify-ip-per-10-minutes: ${APP_RATE_LIMIT_VERIFY_IP_PER_10_MINUTES:20}
    resend-email-per-10-minutes: ${APP_RATE_LIMIT_RESEND_EMAIL_PER_10_MINUTES:3}
    resend-ip-per-hour: ${APP_RATE_LIMIT_RESEND_IP_PER_HOUR:10}
    refresh-ip-per-minute: ${APP_RATE_LIMIT_REFRESH_IP_PER_MINUTE:30}
    google-ip-per-10-minutes: ${APP_RATE_LIMIT_GOOGLE_IP_PER_10_MINUTES:10}
    claim-per-user-per-minute: ${APP_RATE_LIMIT_CLAIM_PER_USER_PER_MINUTE:5}
    claim-per-ip-per-minute: ${APP_RATE_LIMIT_CLAIM_PER_IP_PER_MINUTE:20}
    forgot-per-email-per-hour: ${APP_RATE_LIMIT_FORGOT_PER_EMAIL_PER_HOUR:3}
    forgot-per-ip-per-hour: ${APP_RATE_LIMIT_FORGOT_PER_IP_PER_HOUR:10}
    reset-per-ip-per-10-minutes: ${APP_RATE_LIMIT_RESET_PER_IP_PER_10_MINUTES:10}
    change-password-per-user-per-10-minutes: ${APP_RATE_LIMIT_CHANGE_PASSWORD_PER_USER_PER_10_MINUTES:5}

  # Origins allowed to call /api/** from a browser (the Flutter web build). Comma-
  # separated patterns, e.g. https://app.example.com. Empty disables CORS entirely,
  # which is correct for a deployment that serves no browser client.
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

  # Only trust X-Forwarded-For when the direct peer is one of these proxies.
  trusted-proxies: ${APP_TRUSTED_PROXIES:}

  http:
    max-request-bytes: ${APP_HTTP_MAX_REQUEST_BYTES:1048576}


  # Native Google sign-in (ID token verified locally). Browser OAuth is not used.
  #
  # A comma-separated list of every Google OAuth client whose ID tokens are accepted.
  # Each platform signs in with its own client and the token's `aud` is that client, so
  # supporting Android, macOS and desktop means listing all three. Entries must belong
  # to this Google project: the audience is what proves a token was minted for us.
  # Only client IDs go here - no client secret is involved in verifying an ID token.
  oauth2:
    google:
      client-id: ${APP_OAUTH2_GOOGLE_CLIENT_ID:}

  # Bootstrap admin account (created on first boot if no ADMIN exists).
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_NAME:System Administrator}

  # Mail / verification
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@electricwave.local}

  # DEV ONLY: return the verification code in API responses when mail is off.
  auth:
    expose-verification-code: ${APP_AUTH_EXPOSE_VERIFICATION_CODE:false}

# =============================================================================
# OpenAPI / Swagger UI (ADMIN-only, see SecurityConfig)
# =============================================================================
springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.security: INFO
    ma.electricwave: INFO
