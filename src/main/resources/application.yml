# =============================================================================
# ElectricWave access backend - base configuration (no secrets, no defaults
# that are unsafe outside development). Profile-specific values live in
# application-dev.yml and application-prod.yml.
# =============================================================================

spring:
  application:
    name: electricwave-access
  profiles:
    default: dev

  # ----------------------------------------------------------------------------
  # PostgreSQL (matches compose.yaml; override via env in real deployments)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  # ----------------------------------------------------------------------------
  # JPA
  # ----------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------------------------------------------
  # Flyway
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ----------------------------------------------------------------------------
  # Redis (verification codes, refresh tokens, rate limits)
  # ----------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ----------------------------------------------------------------------------
  # Mail (SMTP) - start-up safe: app.mail.enabled=false skips sending entirely
  # ----------------------------------------------------------------------------
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Auto-starts the containers in compose.yaml during development
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}

# =============================================================================
# Application specific settings
# =============================================================================
app:
  # AES-256-GCM master key, base64 encoded, exactly 32 bytes.
  crypto:
    master-key: ${APP_CRYPTO_MASTER_KEY:}

  # JWT: HS256. The secret must be at least 32 bytes and has no default.
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:electricwave}
    expiration: ${APP_JWT_EXPIRATION:15m}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:30d}

  # Redis-backed fixed-window rate limits for public authentication endpoints.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-ip-per-minute: ${APP_RATE_LIMIT_LOGIN_IP_PER_MINUTE:10}
    login-email-per-minute: ${APP_RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:5}
    register-ip-per-hour: ${APP_RATE_LIMIT_REGISTER_IP_PER_HOUR:5}
    verify-ip-per-10-minutes: ${APP_RATE_LIMIT_VERIFY_IP_PER_10_MINUTES:20}
    resend-email-per-10-minutes: ${APP_RATE_LIMIT_RESEND_EMAIL_PER_10_MINUTES:3}
    resend-ip-per-hour: ${APP_RATE_LIMIT_RESEND_IP_PER_HOUR:10}
    refresh-ip-per-minute: ${APP_RATE_LIMIT_REFRESH_IP_PER_MINUTE:30}
    google-ip-per-10-minutes: ${APP_RATE_LIMIT_GOOGLE_IP_PER_10_MINUTES:10}

  # Native Google sign-in (ID token verified locally). Browser OAuth is not used.
  oauth2:
    google:
      client-id: ${APP_OAUTH2_GOOGLE_CLIENT_ID:}

  # Bootstrap admin account (created on first boot if no ADMIN exists).
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_NAME:System Administrator}

  # Mail / verification
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@electricwave.local}

  # DEV ONLY: return the verification code in API responses when mail is off.
  auth:
    expose-verification-code: ${APP_AUTH_EXPOSE_VERIFICATION_CODE:false}

# =============================================================================
# OpenAPI / Swagger UI (ADMIN-only, see SecurityConfig)
# =============================================================================
springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.security: INFO
    ma.electricwave: INFO
