# =============================================================================
# ElectricWave backend configuration
# =============================================================================

spring:
  application:
    name: electricwave-api

  # ----------------------------------------------------------------------------
  # PostgreSQL (matches compose.yaml; override via env in real deployments)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  # ----------------------------------------------------------------------------
  # JPA
  # ----------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------------------------------------------
  # Flyway
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ----------------------------------------------------------------------------
  # Redis (verification codes, caching)
  # ----------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ----------------------------------------------------------------------------
  # Mail (SMTP) - start-up safe: app.mail.enabled=false skips sending entirely
  # ----------------------------------------------------------------------------
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Auto-starts the containers in compose.yaml during development
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}

# =============================================================================
# Application specific settings
# =============================================================================
app:
  # JWT: HS256. The secret must be >= 32 bytes. ALWAYS override in production.
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-with-at-least-32-bytes!!}
    issuer: electricwave
    # Short-lived access token; mobile clients refresh it via /api/auth/refresh.
    expiration: ${JWT_EXPIRATION:30m}
    # Opaque refresh token stored (hashed) in Redis and rotated on every use.
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}

  # Redis-backed fixed-window rate limits for public authentication endpoints.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-ip-per-minute: ${RATE_LIMIT_LOGIN_IP_PER_MINUTE:10}
    login-email-per-minute: ${RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:5}
    register-ip-per-hour: ${RATE_LIMIT_REGISTER_IP_PER_HOUR:5}
    verify-ip-per-10-minutes: ${RATE_LIMIT_VERIFY_IP_PER_10_MINUTES:20}
    resend-email-per-10-minutes: ${RATE_LIMIT_RESEND_EMAIL_PER_10_MINUTES:3}
    resend-ip-per-hour: ${RATE_LIMIT_RESEND_IP_PER_HOUR:10}
    refresh-ip-per-minute: ${RATE_LIMIT_REFRESH_IP_PER_MINUTE:30}
    google-ip-per-10-minutes: ${RATE_LIMIT_GOOGLE_IP_PER_10_MINUTES:10}

  # Where the browser lands right after a successful Google login.
  # The issued JWT is appended as a "token" query parameter.
  oauth2:
    success-url: ${OAUTH2_SUCCESS_URL:/api/auth/oauth2/success}
    google:
      # Google OAuth2 login is enabled only when BOTH values are non-blank.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

  # Bootstrap admin account (created on first boot if no ADMIN exists).
  admin:
    email: ${ADMIN_EMAIL:admin@electricwave.local}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_NAME:System Administrator}

  # Mail / verification
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@electricwave.local}

  # DEV ONLY: return the verification code in the register response when mail
  # sending is disabled. Keep false in production.
  auth:
    expose-verification-code: ${AUTH_EXPOSE_CODE:true}

# =============================================================================
# OpenAPI / Swagger UI (ADMIN-only, see SecurityConfig)
# =============================================================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# =============================================================================
# Spring Boot Admin server (dev monitoring UI, secured note: permitAll in this
# SecurityConfig; restrict before running in production)
# =============================================================================
spring.boot.admin:
  context-path: /monitoring

logging:
  level:
    org.springframework.security: INFO
    ma.electricwave: INFO
